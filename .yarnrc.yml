approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

npmMinimalAgeGate: 0

packageExtensions:
  "@typescript-eslint/parser@*":
    dependencies:
      typescript: "*"
  "@typescript-eslint/typescript-estree@*":
    dependencies:
      typescript: "*"
  eslint-module-utils@*:
    dependencies:
      typescript: "*"
  # vite-plugin-dts forwards typescript to unplugin-dts but omits it from its
  # peers, which breaks require("typescript") under PnP. Declare it explicitly.
  "vite-plugin-dts@*":
    peerDependencies:
      typescript: ">=4"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
