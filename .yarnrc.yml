approvedGitRepositories:
    - '**'

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

npmMinimalAgeGate: 0

packageExtensions:
    # vite-plugin-dts forwards typescript to unplugin-dts but omits it from its
    # peers, which breaks require("typescript") under PnP. Declare it explicitly.
    'vite-plugin-dts@*':
        peerDependencies:
            typescript: '>=4'

    # The browser provider chain does not forward vite down to @vitest/mocker,
    # which declares it as a peer. Without this, loading a vitest config with a
    # browser project fails to resolve require("vite/package.json") under PnP.
    '@vitest/browser@*':
        peerDependencies:
            vite: '*'
    '@vitest/browser-playwright@*':
        peerDependencies:
            vite: '*'

yarnPath: .yarn/releases/yarn-4.18.0.cjs
