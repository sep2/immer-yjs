name: 'Code Integration Checks'
on:
    pull_request:
    workflow_call:

jobs:
    integration-checks:
        runs-on: ubuntu-latest
        name: Code Integration Checks
        steps:
            - name: Check out
              uses: actions/checkout@v4
            - name: Set up node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'
            - name: Install
              run: yarn install --immutable
            - name: Check Code Formatting
              if: always()
              run: yarn formatting:check
            - name: Check Types
              if: always()
              run: yarn turbo run types:check
            - name: Lint
              if: always()
              run: yarn turbo run lint
            - name: Test
              if: always()
              run: yarn turbo run test
            - name: Build
              if: always()
              run: yarn turbo run build
