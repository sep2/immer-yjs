name: Publish

on:
    workflow_call:
        inputs:
            tag:
                description: 'npm dist-tag to publish under'
                required: false
                default: latest
                type: string
        secrets:
            NPM_TOKEN:
                required: true
    workflow_dispatch:
        inputs:
            tag:
                description: 'npm dist-tag to publish under. Use beta/rc for prereleases so `latest` keeps pointing at the current stable release.'
                required: true
                default: beta
                type: choice
                options:
                    - beta
                    - rc
                    - next
                    - latest

permissions:
    contents: read

jobs:
    ci:
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/code-integration-checks.yml

    publish-npm:
        name: Publish NPM
        needs: ci
        if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'
            # `npm stage publish` requires npm >= 11.15.0, but Node 22 ships npm 10.
            - name: Update npm (staged publishing support)
              run: npm install -g npm@11.15.0
            - name: Install
              run: yarn install --immutable
            - name: Build
              run: yarn turbo run build --filter=immer-yjs
            - name: Copy readme into package
              run: yarn workspace immer-yjs copy-readme
            # A prerelease version (e.g. 2.0.0-beta.0) is rejected by npm unless an
            # explicit dist-tag is given, so `tag` is always passed.
            - name: Stage publish to npm (awaits 2FA approval)
              run: npm stage publish --access public --tag "${{ inputs.tag }}"
              working-directory: packages/immer-yjs
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
